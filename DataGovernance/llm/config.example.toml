# Copy this file to config.toml and fill in api_key.
# config.toml is gitignored so the key stays on your machine.
#
# The top-level model is the default. A prompt section names one of the
# [llm.<name>] tables below. Each named model sets its own base_url,
# timeout, and temperature. api_key is taken from the top unless that
# table sets it. temperature is the chat-completions sampling value, from
# 0 to 2. Omit it on the default endpoint to use 1. concurrency is how
# many chats are in flight at once. Named models inherit it.

model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
api_key = ""
timeout = 60
temperature = 1
concurrency = 1

[llm.draft]
model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
timeout = 60
temperature = 1

[llm.judge]
model = "gpt-4o"
base_url = "https://api.openai.com/v1"
timeout = 60
temperature = 0
