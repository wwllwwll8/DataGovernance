[project]
name = "df-distilabel"
version = "0.1.0"
description = "DataFlow-style operators and pipelines with Distilabel-style LLM task recipes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
math = [
    "math-verify",
]
distilabel = [
    "distilabel",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["df_distilabel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
