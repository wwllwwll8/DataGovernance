[project]
name = "DataGovernance"
version = "0.1.0"
description = "DataGovernance：在调用模型之前画出每一列的读写血缘"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
hub = [
    "huggingface_hub",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["DataGovernance*"]

[tool.setuptools.package-data]
"DataGovernance.recipes" = ["*.toml"]
"DataGovernance.llm" = ["config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
