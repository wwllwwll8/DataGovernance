[project]
name = "throughline"
version = "0.1.0"
description = "Throughline：在调用模型之前画出每一列的读写血缘"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
math = [
    "math-verify",
]
distilabel = [
    "distilabel",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["throughline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
